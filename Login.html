<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Agriculture & Farm</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-layout {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-light);
            padding: 2rem;
            position: relative;
        }
        .back-link {
            position: absolute;
            top: 2rem; left: 2rem;
            font-weight: 600;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .auth-card {
            background: var(--secondary-color);
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
        }
        .form-group { margin-bottom: 1.5rem; position: relative; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary-color); }
        .form-group.error .form-control { border-color: #ef4444; }
        .error-message { color: #ef4444; font-size: 0.85rem; margin-top: 0.3rem; display: block; }
        
        .role-selector {
            display: flex; gap: 1rem; margin-bottom: 1.5rem;
        }
        .role-option {
            flex: 1; text-align: center;
        }
        .role-option input { display: none; }
        .role-option label {
            display: block; padding: 0.8rem; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .role-option input:checked + label {
            background: var(--primary-color); color: white; border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        
        <div class="auth-card" id="login-card">
            <div class="text-center" style="">
                <img src="assets/images/logo.webp" alt="Logo" style="height:40px; margin-bottom:1rem;">
                <h2>Welcome Back</h2>
                <p>Login to manage your farm</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Login As</label>
                    <div class="role-selector">
                        <div class="role-option">
                            <input type="radio" name="role" id="role-admin" value="admin" checked>
                            <label for="role-admin">Admin</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="role" id="role-farmer" value="farmer">
                            <label for="role-farmer">Farmer</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email / User ID</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter email">
                </div>
                
                <div class="form-group">
                    <div style="display:flex; justify-content:space-between;">
                        <label>Password</label>
                        <a href="404.html" style="font-size:0.85rem; color:var(--primary-color);">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="Enter password">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
                
                <p class="text-center" style="margin-top:1.5rem;">
                    Don't have an account? <a href="Signup.html" style="color:var(--primary-color); font-weight:600;">Create an Account</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/validation.js"></script>
    <script>
        gsap.from("#login-card", { y: 30, opacity: 0, duration: 0.8, ease: "power2.out" });
    </script>
</body>
</html>
