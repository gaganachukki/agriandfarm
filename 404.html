<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Agriculture & Farm</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), url('assets/images/404-bg.webp') center/cover;
            position: relative;
            overflow: hidden;
        }
        .error-content {
            z-index: 2;
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 4px 4px 0px var(--accent-color);
        }
        .cloud {
            position: absolute;
            color: var(--secondary-color);
            opacity: 0.8;
            font-size: 4rem;
            animation: float 6s infinite ease-in-out;
            z-index: 1;
        }
        .cloud-1 { top: 20%; left: 10%; animation-delay: 0s; font-size: 6rem; }
        .cloud-2 { top: 30%; right: 15%; animation-delay: 2s; }
        .cloud-3 { bottom: 20%; left: 20%; animation-delay: 4s; }
    </style>
</head>
<body>
    <div class="error-page">
        <i class="fas fa-cloud cloud cloud-1 text-light"></i>
        <i class="fas fa-cloud cloud cloud-2 text-light"></i>
        <i class="fas fa-tractor cloud cloud-3" style="color:var(--primary-color);"></i>
        
        <div class="error-content">
            <div class="error-code">404</div>
            <h2>Oops! This Field Doesn't Exist.</h2>
            <p style="margin-bottom: 2rem;">The page you are looking for could not be found. Let's get you back to the farm.</p>
            <div style="display:flex; gap:1rem; justify-content:center;">
                <button onclick="history.back()" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</button>
                <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.from(".error-content", { y: -50, opacity: 0, duration: 1, ease: "bounce.out" });
    </script>
</body>
</html>
